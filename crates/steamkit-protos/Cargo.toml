[package]
name = "steamkit-rs-protos"
description = "Steam protobuf message and enum types, generated with prost."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["steam", "protobuf", "valve"]
categories = ["api-bindings"]

[lib]
name = "steamkit_protos"

# The `steam` and `gc` messages are always built. Each of the others is a
# large generated module of its own, so they can be turned off.
[features]
default = ["csgo", "dota2", "tf2", "deadlock", "webui"]
csgo = []
dota2 = []
tf2 = []
deadlock = []
webui = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
prost.workspace = true
prost-types.workspace = true

[build-dependencies]
prost.workspace = true
prost-build = "0.13"
prost-types.workspace = true
protoc-bin-vendored = "3"
