[package]
name = "steamkit-tests"
description = "Integration tests for steamkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
steamkit = { package = "steamkit-rs", path = "../steamkit" }
steamkit-protos = { package = "steamkit-rs-protos", path = "../steamkit-protos" }
steamkit-tools = { path = "../steamkit-tools" }
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde_json.workspace = true
hex.workspace = true
base64.workspace = true
rand.workspace = true
reqwest = { version = "0.12", features = ["blocking"] }
prost.workspace = true
prost-types.workspace = true
bytes.workspace = true
# Builds the gzip-compressed `Multi` messages of the CM client tests.
flate2 = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
