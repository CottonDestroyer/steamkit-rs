[package]
name = "steamkit-samples"
description = "Sample programs for steamkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
steamkit = { path = "../steamkit" }
# Some samples build protobuf messages directly; steamkit doesn't re-export them.
steamkit-protos = { path = "../steamkit-protos" }
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
# Only needed to name `reqwest::Method` for `call_with_method`.
reqwest = { version = "0.12", features = ["json"] }

