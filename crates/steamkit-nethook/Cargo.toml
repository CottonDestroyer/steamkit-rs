[package]
name = "steamkit-nethook"
description = "Rust port of NetHook2, a Windows DLL that is injected into Steam.exe to dump the Steam client's network traffic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "steamkit_nethook"
crate-type = ["cdylib"]

[dependencies]
# Valve's protobuf messages, generated by steamkit-protos.
steamkit-protos = { path = "../steamkit-protos" }
prost.workspace = true

# Gzip decoding for compressed Multi messages.
flate2 = "1"

# Process injection, module loading, memory protection, threads.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# build.rs stamps the build date into the DLL.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
